# =============================================================================
#  유리알의 밤 — CI
#
#  게임 자체는 의존성이 없다. 규칙 테스트도 Node 하나로 돌아간다.
#  브라우저가 필요한 것은 화면·성능·적대적 테스트뿐이라 작업을 둘로 나눈다.
#  규칙이 깨졌는지는 20초 안에 알 수 있어야 한다.
# =============================================================================
name: CI

on:
  push:
    branches: ['**']      # 태그는 제외. 어느 브랜치에 올리든 바로 돈다
  workflow_dispatch:

# 같은 브랜치에 연달아 올리면 앞의 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: 규칙 · 정적 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 문법 검사
        run: |
          for f in js/*.js tests/*.js; do
            node --check "$f" || exit 1
          done
          echo "검사한 파일: $(ls js/*.js tests/*.js | wc -l)개"

      - name: 규칙 테스트 (의존성 없음)
        run: node tests/engine.test.js

      # 이 게임의 약속 중 하나가 '외부 요청 0'이다.
      # 실행 중 요청은 tests/acceptance.js 가 잡지만, 소스에 외부 주소가
      # 섞여 들어오는 것은 여기서 미리 막는다.
      - name: 외부 자원 참조가 없는지
        run: |
          hits=$(grep -rInE '(src|href)="https?://|@import +url\(|fonts\.googleapis' \
            index.html css js || true)
          if [ -n "$hits" ]; then
            echo "외부 자원을 참조하고 있습니다:"
            echo "$hits"
            exit 1
          fi
          echo "외부 자원 참조 없음"

      - name: 참조한 파일이 모두 있는지
        run: |
          missing=0
          for f in $(grep -oE '(src|href)="[^"]+"' index.html | sed 's/.*="//;s/"//'); do
            case "$f" in http*) continue ;; esac
            if [ ! -f "$f" ]; then echo "없는 파일: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] && echo "참조 파일 모두 존재"

  browser:
    name: 브라우저 · 수용 기준 · 적대적
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Chromium 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.56.1

      - name: Playwright 설치
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: 수용 기준 (AC-1~13)
        run: node tests/acceptance.js shots

      - name: 적대적 테스트
        run: node tests/fuzz.js

      # 프레임 시간은 러너 성능에 좌우돼 가짜 실패를 만든다.
      # 숫자는 로그에 남기되 판정에서는 뺀다. 입력 타이밍·난이도 곡선·
      # 레이아웃·견고함은 기계와 무관하므로 그대로 판정한다.
      - name: 실측 (프레임은 참고용)
        env:
          FRAME_GATE: advisory
        run: node tests/perf.js

      - name: 실패했을 때 화면 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 7
